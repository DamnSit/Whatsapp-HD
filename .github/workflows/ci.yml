name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Install and validate CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package manager
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Verify CLI help
        run: node index.js --help

      - name: Build npm package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Validate packaged installation and dependency audit
        run: |
          npm install --prefix "$RUNNER_TEMP/whatsapp-hd-consumer" "$RUNNER_TEMP"/whatsapp-hd-*.tgz
          npm audit --prefix "$RUNNER_TEMP/whatsapp-hd-consumer"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/whatsapp-hd-consumer/node_modules/.bin/whatsapp-hd" --help
