name: Build Status Bridge

on:
  push:
    branches: [main]
    paths:
      - "android-helper/**"
      - ".github/workflows/build-status-bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-helper/**"
      - ".github/workflows/build-status-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android bridge APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-helper
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-hd-status-bridge-debug
          path: android-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
